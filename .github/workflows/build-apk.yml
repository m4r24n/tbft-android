name: Build TBFT Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'TBFT-Android/**'
      - '.github/workflows/build-apk.yml'
  push:
    branches: [ main ]
    paths:
      - 'TBFT-Android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Test, lint and build native app
        working-directory: TBFT-Android
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug assembleRelease

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TBFT-Verification
          path: TBFT-Android/app/build/reports/
          retention-days: 30

      - name: Upload TBFT APK
        uses: actions/upload-artifact@v4
        with:
          name: TBFT-Native-Unsigned
          path: TBFT-Android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Include public Android APK signing tool
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Android-Signing-Tool
          path: apksigner.jar
          retention-days: 30

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify offline flows on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          working-directory: TBFT-Android
          script: bash ../scripts/device-check.sh
      - name: Collect native screenshots
        if: always()
        run: adb pull /sdcard/Android/data/info.marzan.tbft.nativeapp.debug/files/screenshots native-screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TBFT-Device-Verification
          path: |
            native-screenshots/
            TBFT-Android/app/build/reports/androidTests/
            TBFT-Android/app/build/outputs/androidTest-results/
          retention-days: 30

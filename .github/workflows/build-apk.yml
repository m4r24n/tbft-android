name: Build TBFT Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'TBFT-Android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: TBFT-Android
        run: gradle --no-daemon assembleDebug

      - name: Upload TBFT APK
        uses: actions/upload-artifact@v4
        with:
          name: TBFT-Android-APK
          path: TBFT-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
